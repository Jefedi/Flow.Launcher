body:
  - type: textBlock
    attributes:
      description: |
        Réglages du plugin LibreTranslate. Indique l'URL de ton instance,
        choisis la langue cible, et (optionnel) ajoute une clé API.

  - type: input
    attributes:
      name: instance_url
      label: URL de l'instance
      description: "URL de base de ton instance LibreTranslate (le slash final est ignoré)."
      defaultValue: https://translate.jefe.ovh

  - type: dropdown
    attributes:
      name: target_lang
      label: Langue cible
      description: >
        Code de langue LibreTranslate vers lequel traduire (c'est ce code qui est
        envoyé à l'API). Liste complète proposée par l'instance.
      defaultValue: fr
      options:
        - ar        # Arabic
        - az        # Azerbaijani
        - bg        # Bulgarian
        - bn        # Bengali
        - ca        # Catalan
        - cs        # Czech
        - da        # Danish
        - de        # German
        - el        # Greek
        - en        # English
        - eo        # Esperanto
        - es        # Spanish
        - et        # Estonian
        - eu        # Basque
        - fa        # Persian
        - fi        # Finnish
        - fr        # French
        - ga        # Irish
        - gl        # Galician
        - he        # Hebrew
        - hi        # Hindi
        - hu        # Hungarian
        - id        # Indonesian
        - it        # Italian
        - ja        # Japanese
        - ko        # Korean
        - ky        # Kyrgyz
        - lt        # Lithuanian
        - lv        # Latvian
        - ms        # Malay
        - nb        # Norwegian
        - nl        # Dutch
        - pl        # Polish
        - pt        # Portuguese
        - pt-BR     # Portuguese (Brazil)
        - ro        # Romanian
        - ru        # Russian
        - sk        # Slovak
        - sl        # Slovenian
        - sq        # Albanian
        - sv        # Swedish
        - th        # Thai
        - tl        # Tagalog
        - tr        # Turkish
        - uk        # Ukrainian
        - ur        # Urdu
        - vi        # Vietnamese
        - zh-Hans   # Chinese (Simplified)
        - zh-Hant   # Chinese (Traditional)

  - type: passwordBox
    attributes:
      name: api_key
      label: Clé API (optionnel)
      description: "Laisse vide si ton instance n'exige pas de clé API."
      defaultValue: ""
