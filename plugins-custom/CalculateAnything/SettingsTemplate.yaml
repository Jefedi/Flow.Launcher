body:
  - type: textBlock
    attributes:
      description: |
        Calculate Anything — calculatrice en langage naturel.
        Tape le mot-clé suivi d'une expression, ex :  = 15% of 80

  - type: dropdown
    attributes:
      name: angle_unit
      label: Unité d'angle
      description: "Unité utilisée par les fonctions trigonométriques (sin, cos, tan…)."
      defaultValue: radians
      options:
        - radians
        - degrees

  - type: checkbox
    attributes:
      name: thousands_separator
      label: Séparateur de milliers
      description: "Grouper les grands résultats (ex : 1,234,567)."
      defaultValue: "false"

  - type: input
    attributes:
      name: default_currency
      label: Devise par défaut
      description: "Devise cible quand la conversion n'en précise pas (ex : « 100 usd »)."
      defaultValue: EUR
